<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        var raw = localStorage.getItem("chessin_state_v1");
        if (raw && JSON.parse(raw).theme === "light") {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Play Chessin, a free solo chess puzzle game. Capture pieces on a 5x5 board until only one piece is left."
    />
    <meta
      name="keywords"
      content="chessin, solo chess, solitaire chess, chess puzzle, 5x5 chess, logic puzzle, browser chess game"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f0f0f" />
    <link rel="canonical" href="https://chessin.org/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chessin" />
    <meta property="og:title" content="Chessin - Solo Chess Puzzle Game" />
    <meta
      property="og:description"
      content="Play Chessin, a free solo chess puzzle game. Capture pieces on a 5x5 board until only one piece is left."
    />
    <meta property="og:url" content="https://chessin.org/" />
    <meta property="og:image" content="https://chessin.org/og-image.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Chessin queen icon" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Chessin - Solo Chess Puzzle Game" />
    <meta
      name="twitter:description"
      content="Play Chessin, a free solo chess puzzle game. Capture pieces on a 5x5 board until only one piece is left."
    />
    <meta name="twitter:image" content="https://chessin.org/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Chessin",
        "url": "https://chessin.org/",
        "description": "Play Chessin, a free solo chess puzzle game. Capture pieces on a 5x5 board until only one piece is left.",
        "genre": ["Puzzle", "Chess"],
        "gamePlatform": "Web Browser",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <title>Chessin - Solo Chess Puzzle Game</title>
  </head>
  <body class="bg-background text-foreground antialiased select-none">
    <div id="app" class="min-h-screen w-full">
      <noscript>
        <main>
          <h1>Chessin</h1>
          <p>
            Play Chessin, a free solo chess puzzle game. Capture pieces on a 5x5
            board until only one piece is left.
          </p>
        </main>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
