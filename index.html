<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        var raw = localStorage.getItem("chessin_state_v1");
        if (raw && JSON.parse(raw).theme === "light") {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Chessin: A minimalist monochrome solo chess puzzle game."
    />
    <title>Chessin</title>
  </head>
  <body class="bg-background text-foreground antialiased select-none">
    <div id="app" class="min-h-screen w-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
